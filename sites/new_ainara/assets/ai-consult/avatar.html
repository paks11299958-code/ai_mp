<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 상담 아바타</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #020617 0%, #1e3a8a 100%);
      overflow: hidden;
    }
    model-viewer { width: 100%; height: 100%; background: transparent; }
    .progress-bar {
      width: 50%; height: 6px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%); border-radius: 25px;
      background: rgba(255,255,255,.15);
    }
    .progress-bar.hide { visibility: hidden; }
    .update-bar {
      width: 0; height: 100%; border-radius: 25px; background: #2563eb;
      transition: width .3s;
    }
  </style>
</head>
<body>
  <model-viewer id="avatar" src="./via3.glb" camera-controls autoplay
    animation-name="Wave" tone-mapping="neutral" shadow-intensity="0.8"
    interaction-prompt="none">
    <div class="progress-bar hide" slot="progress-bar">
      <div class="update-bar"></div>
    </div>
  </model-viewer>
  <script>
    const avatar = document.querySelector('#avatar');
    avatar.addEventListener('progress', (event) => {
      const bar = avatar.querySelector('.progress-bar');
      const update = avatar.querySelector('.update-bar');
      update.style.width = `${event.detail.totalProgress * 100}%`;
      bar.classList.toggle('hide', event.detail.totalProgress === 1);
    });
    avatar.addEventListener('load', () => {
      window.setTimeout(() => avatar.pause(), avatar.duration * 1000);
    });
  </script>
</body>
</html>
