<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서아 AI 사업 상담 매니저</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:#eef5fb}
    .avatar{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 22%,#fff 0,#edf5fc 48%,#c8daec 100%)}
    video{width:100%;height:100%;display:block;object-fit:cover;object-position:center 34%;transition:filter .25s ease,transform .25s ease}
    [data-state="thinking"] video{filter:saturate(.92) brightness(.98);animation:thinking 1.9s ease-in-out infinite}
    [data-state="fallback"] video{filter:saturate(.82)}
    .state{position:absolute;z-index:2;left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:8px 12px;border:1px solid rgba(75,106,141,.2);border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(33,63,99,.14);color:#31465e;font-size:12px;font-weight:700;white-space:nowrap;backdrop-filter:blur(10px)}
    .dot{width:7px;height:7px;border-radius:50%;background:#5f8fc6;box-shadow:0 0 0 4px rgba(95,143,198,.13)}
    [data-state="thinking"] .dot{animation:pulse 1s ease-in-out infinite}
    [data-state="speaking"] .dot{background:#28a170;box-shadow:0 0 0 4px rgba(40,161,112,.14)}
    [data-state="fallback"] .dot{background:#b98432;box-shadow:0 0 0 4px rgba(185,132,50,.14)}
    @keyframes thinking{50%{transform:translateY(-3px)}}
    @keyframes pulse{50%{opacity:.4;transform:scale(.72)}}
    @media(prefers-reduced-motion:reduce){video,.dot{animation:none!important;transition:none}}
  </style>
</head>
<body>
  <main class="avatar" id="avatar" data-state="idle">
    <video id="avatar-video" src="./seoa-idle.mp4" autoplay muted loop playsinline preload="auto" poster="./seoa-consult-poster.png" aria-label="서아 AI 사업 상담 매니저"></video>
    <div class="state" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="state-text">상담 준비가 되었어요</span></div>
  </main>
  <script>
    const STATES = new Set(['GREETING','IDLE','THINKING','SPEAKING','FALLBACK']);
    // ★인사 영상은 대사가 있어서 **1회만** 재생한다. 반복하면 "안녕하세요"가 무한히 돈다.
    //   끝나면 스스로 IDLE 로 넘어간다(부모가 따로 안 시켜도 된다).
    const root = document.querySelector('#avatar');
    const video = document.querySelector('#avatar-video');
    const status = document.querySelector('#state-text');

    async function setState(value) {
      const state = String(value || '').toUpperCase();
      if (!STATES.has(state)) return;
      const src = state === 'GREETING' ? './seoa-greeting.mp4'
        : state === 'SPEAKING' ? './seoa-speaking-poc.mp4' : './seoa-idle.mp4';
      root.dataset.state = state.toLowerCase();
      status.textContent = state === 'GREETING' ? '서아가 인사하고 있어요'
        : state === 'THINKING' ? '답변을 준비하고 있어요'
        : state === 'SPEAKING' ? '서아가 답변하고 있어요'
        : state === 'FALLBACK' ? '연결을 확인하고 있어요'
        : '상담 준비가 되었어요';
      const greeting = state === 'GREETING';
      // ★인사만 소리를 켠다. 자동재생 정책상 음소거가 아니면 막힐 수 있어,
      //   실패하면 아래 catch 에서 음소거로 한 번 더 시도한다(영상까지 잃지 않게).
      video.loop = !greeting;
      video.muted = !greeting;
      if (!video.currentSrc.endsWith(src.slice(1))) { video.src = src; video.load(); }
      video.playbackRate = state === 'THINKING' ? .82 : 1;
      try { await video.play(); }
      catch {
        // 소리 있는 자동재생이 막힌 경우 — 음소거로 낮춰 인사 영상이라도 보여준다.
        if (greeting) { video.muted = true; try { await video.play(); return; } catch {} }
        if (state !== 'FALLBACK') setState('FALLBACK');
      }
    }

    // 인사가 끝나면 스스로 대기로 돌아간다(다른 상태에서는 loop 라 ended 가 안 온다).
    video.addEventListener('ended', () => {
      if (root.dataset.state === 'greeting') setState('IDLE');
    });
    video.addEventListener('error', () => {
      if (root.dataset.state !== 'fallback') setState('FALLBACK');
    });
    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.origin !== location.origin) return;
      if (event.data?.type === 'SEOA_AVATAR_STATE') setState(event.data.state);
    });
    // ★부모가 먼저 보낸 상태가 있으면 덮어쓰지 않는다. 여기서 무조건 IDLE 을 걸면
    //   먼저 도착한 GREETING 이 지워진다(초기값은 이미 data-state="idle" 이다).
    if (root.dataset.state === 'idle') setState('IDLE');
    window.parent.postMessage({type:'SEOA_AVATAR_READY'}, location.origin);
  </script>
</body>
</html>
