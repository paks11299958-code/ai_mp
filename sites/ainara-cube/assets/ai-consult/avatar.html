<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 상담 아바타</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 28%, rgba(229, 126, 79, .22), transparent 42%),
        linear-gradient(145deg, #17120f 0%, #080706 100%);
      overflow: hidden;
    }
    model-viewer { width: 100%; height: 100%; background: transparent; }
    .progress-bar {
      width: 50%; height: 6px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%); border-radius: 25px;
      background: rgba(255,255,255,.15);
    }
    .progress-bar.hide { visibility: hidden; }
    .update-bar {
      width: 0; height: 100%; border-radius: 25px; background: #d96c42;
      transition: width .3s;
    }
    .face-mask {
      position: absolute;
      z-index: 2;
      top: 13.2%;
      left: 50%;
      width: clamp(12px, 5.8vh, 34px);
      height: clamp(7px, 3.1vh, 18px);
      transform: translateX(-50%);
      border: 1px solid rgba(151, 138, 122, .7);
      border-radius: 42% 42% 48% 48% / 34% 34% 66% 66%;
      background:
        linear-gradient(to bottom, transparent 32%, rgba(166, 154, 139, .2) 34% 38%, transparent 40% 59%, rgba(166, 154, 139, .17) 61% 65%, transparent 67%),
        linear-gradient(145deg, #f5f0e8, #ded4c7);
      box-shadow: 0 2px 4px rgba(31, 23, 18, .2);
      pointer-events: none;
    }
    .face-mask::before,
    .face-mask::after {
      content: "";
      position: absolute;
      top: 18%;
      width: 22%;
      height: 70%;
      border: 1px solid rgba(222, 212, 199, .9);
      border-radius: 50%;
    }
    .face-mask::before { right: 92%; border-right: 0; }
    .face-mask::after { left: 92%; border-left: 0; }
  </style>
</head>
<body>
  <model-viewer id="avatar" src="./seoa-consult-rigged.glb"
    poster="./seoa-consult-poster.png"
    camera-orbit="90deg 82deg auto" min-camera-orbit="auto 68deg auto"
    max-camera-orbit="auto 96deg auto" tone-mapping="neutral"
    shadow-intensity="0.8" exposure="1.05" interaction-prompt="none"
    alt="AI 상담 매니저 서아 3D 아바타">
    <div class="progress-bar hide" slot="progress-bar">
      <div class="update-bar"></div>
    </div>
  </model-viewer>
  <div class="face-mask" aria-hidden="true"></div>
  <script>
    const avatar = document.querySelector('#avatar');
    avatar.addEventListener('progress', (event) => {
      const bar = avatar.querySelector('.progress-bar');
      const update = avatar.querySelector('.update-bar');
      update.style.width = `${event.detail.totalProgress * 100}%`;
      bar.classList.toggle('hide', event.detail.totalProgress === 1);
    });
  </script>
</body>
</html>
