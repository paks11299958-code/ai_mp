<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서아 AI 사업 상담 매니저</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:#eef5fb}
    .avatar{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 22%,#fff 0,#edf5fc 48%,#c8daec 100%)}
    video{width:100%;height:100%;display:block;object-fit:cover;object-position:center 34%;transition:filter .25s ease,transform .25s ease}
    [data-state="thinking"] video{filter:saturate(.92) brightness(.98);animation:thinking 1.9s ease-in-out infinite}
    [data-state="fallback"] video{filter:saturate(.82)}
    .state{position:absolute;z-index:2;left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:8px 12px;border:1px solid rgba(75,106,141,.2);border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(33,63,99,.14);color:#31465e;font-size:12px;font-weight:700;white-space:nowrap;backdrop-filter:blur(10px)}
    .dot{width:7px;height:7px;border-radius:50%;background:#5f8fc6;box-shadow:0 0 0 4px rgba(95,143,198,.13)}
    [data-state="thinking"] .dot{animation:pulse 1s ease-in-out infinite}
    [data-state="speaking"] .dot{background:#28a170;box-shadow:0 0 0 4px rgba(40,161,112,.14)}
    [data-state="fallback"] .dot{background:#b98432;box-shadow:0 0 0 4px rgba(185,132,50,.14)}
    /* 인사 자막 — 소리를 안 켜도 멘트가 전달돼야 한다(자동재생이 음소거라서).
       ★영상 위에 얹되 얼굴을 가리지 않게 아래쪽에 둔다. */
    .caption{position:absolute;z-index:2;left:50%;translate:-50% 0;
      bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));
      width:min(92%,560px);padding:11px 15px;border-radius:12px;
      background:rgba(18,32,48,.82);color:#fff;font-size:15px;font-weight:700;line-height:1.5;
      text-align:center;letter-spacing:-.01em;box-shadow:0 10px 30px rgba(12,26,43,.3);
      backdrop-filter:blur(8px);opacity:0;transition:opacity .25s ease;pointer-events:none;
      overflow-wrap:break-word;}
    .caption[data-show="true"]{opacity:1}
    @media(max-width:420px){.caption{font-size:13.5px;padding:9px 12px;
      bottom:max(64px,calc(env(safe-area-inset-bottom) + 58px))}}

    /* 소리 버튼 — 브라우저가 소리 있는 자동재생을 막으므로 사용자가 직접 켠다.
       ★인사 중에는 눈에 띄어야 한다(멘트를 놓치면 만든 의미가 없다). */
    .sound{position:absolute;z-index:3;top:14px;right:14px;display:flex;align-items:center;gap:7px;
      min-height:44px;padding:10px 14px;border:1px solid rgba(75,106,141,.22);border-radius:999px;
      background:rgba(255,255,255,.92);box-shadow:0 8px 26px rgba(33,63,99,.16);color:#31465e;
      font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;backdrop-filter:blur(10px);
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
    .sound:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(33,63,99,.22)}
    .sound:focus-visible{outline:3px solid #5f8fc6;outline-offset:2px}
    .sound .ico{font-size:15px;line-height:1}
    /* 인사 중 + 아직 음소거면 → 초록으로 강조하고 살짝 흔들어 시선을 끈다 */
    [data-state="greeting"] .sound[data-muted="true"]{background:#28a170;border-color:#28a170;color:#fff;
      box-shadow:0 10px 30px rgba(40,161,112,.4);animation:nudge 1.5s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes thinking{50%{transform:translateY(-3px)}}
    @keyframes pulse{50%{opacity:.4;transform:scale(.72)}}
    @media(prefers-reduced-motion:reduce){video,.dot,.sound{animation:none!important;transition:none}}
  </style>
</head>
<body>
  <main class="avatar" id="avatar" data-state="idle">
    <video id="avatar-video" src="./seoa-idle.mp4" autoplay muted loop playsinline preload="auto" poster="./seoa-consult-poster.png" aria-label="서아 AI 사업 상담 매니저"></video>
    <p class="caption" id="caption" data-show="false" aria-live="polite"></p>
    <button type="button" class="sound" id="sound-toggle" data-muted="true"
            aria-pressed="false" aria-label="소리 켜기">
      <span class="ico" id="sound-ico" aria-hidden="true">🔇</span><span id="sound-label">소리 켜기</span>
    </button>
    <div class="state" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="state-text">상담 준비가 되었어요</span></div>
  </main>
  <script>
    const STATES = new Set(['GREETING','IDLE','THINKING','SPEAKING','FALLBACK']);
    // ★인사 영상은 대사가 있어서 **1회만** 재생한다. 반복하면 "안녕하세요"가 무한히 돈다.
    //   끝나면 스스로 IDLE 로 넘어간다(부모가 따로 안 시켜도 된다).
    const root = document.querySelector('#avatar');
    const video = document.querySelector('#avatar-video');
    const status = document.querySelector('#state-text');
    const caption = document.querySelector('#caption');
    const soundBtn = document.querySelector('#sound-toggle');

    /**
     * 인사 자막 — [시작초, 끝초, 문구].
     *
     * ★시각은 실제 음성에서 잰 값이다(silencedetect: 3.255~3.792 에 문장 사이 쉼,
     *   전체 7.416초). 눈대중으로 정하면 입과 자막이 어긋난다.
     * ★멘트를 바꾸면 이 표와 seoa-greeting.mp4 를 함께 바꿔야 한다.
     */
    const GREETING_CUES = [
      [0.15, 1.55, '안녕하세요.'],
      [1.55, 3.40, 'AI Companion Partner 상담 매니저입니다.'],
      [3.75, 7.42, '수익 구조, 라이선스, 운영 지원과 신청 절차를 안내해 드립니다.'],
    ];
    const soundIco = document.querySelector('#sound-ico');
    const soundLabel = document.querySelector('#sound-label');
    // ★사용자가 소리를 켰는지 기억한다. 켠 뒤에는 상태가 바뀌어도 유지해야 한다 —
    //   매번 음소거로 되돌리면 켜도 소용이 없다.
    let soundOn = false;

    async function setState(value) {
      const state = String(value || '').toUpperCase();
      if (!STATES.has(state)) return;
      const src = state === 'GREETING' ? './seoa-greeting.mp4'
        : state === 'SPEAKING' ? './seoa-speaking-poc.mp4' : './seoa-idle.mp4';
      root.dataset.state = state.toLowerCase();
      status.textContent = state === 'GREETING' ? '서아가 인사하고 있어요'
        : state === 'THINKING' ? '답변을 준비하고 있어요'
        : state === 'SPEAKING' ? '서아가 답변하고 있어요'
        : state === 'FALLBACK' ? '연결을 확인하고 있어요'
        : '상담 준비가 되었어요';
      const greeting = state === 'GREETING';
      // 인사가 아니면 자막을 지운다(대기·답변 중에 인사말이 남아 있으면 안 된다).
      if (!greeting) { caption.dataset.show = 'false'; caption.textContent = ''; }
      // ★인사만 1회 재생한다(반복하면 "안녕하세요"가 무한히 돈다).
      // ★★소리는 항상 끈다. 브라우저 자동재생 정책상 사용자가 클릭하기 전에는
      //   소리 있는 재생이 막히고, 그러면 재생 실패로 fallback 에 빠진다
      //   (2026-09-03 운영 실측). 소리는 사용자가 스피커 버튼으로 켠다.
      video.loop = !greeting;
      // 사용자가 켰으면 그 선택을 따른다. 아직 안 켰으면 음소거여야 재생이 막히지 않는다.
      video.muted = !soundOn;
      if (!video.currentSrc.endsWith(src.slice(1))) { video.src = src; video.load(); }
      video.playbackRate = state === 'THINKING' ? .82 : 1;
      try { await video.play(); }
      catch {
        // ★load() 직후엔 아직 준비가 안 돼 실패할 수 있다. 한 번 더 기다렸다 시도하고,
        //   그래도 안 되면 그때 fallback 이다(성급히 오류로 만들지 않는다).
        try {
          await new Promise(r => setTimeout(r, 300));
          await video.play();
        } catch {
          if (state !== 'FALLBACK') setState('FALLBACK');
        }
      }
    }

    /** 현재 재생 위치에 해당하는 자막을 고른다. 없으면 숨긴다(문장 사이 쉼). */
    function updateCaption() {
      if (root.dataset.state !== 'greeting') { caption.dataset.show = 'false'; return; }
      const t = video.currentTime;
      const cue = GREETING_CUES.find(([a, b]) => t >= a && t < b);
      if (cue) {
        if (caption.textContent !== cue[2]) caption.textContent = cue[2];
        caption.dataset.show = 'true';
      } else {
        caption.dataset.show = 'false';
      }
    }
    video.addEventListener('timeupdate', updateCaption);

    function renderSound() {
      soundBtn.dataset.muted = String(!soundOn);
      soundBtn.setAttribute('aria-pressed', String(soundOn));
      soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
      soundIco.textContent = soundOn ? '🔊' : '🔇';
      soundLabel.textContent = soundOn ? '소리 켜짐' : '소리 켜기';
    }

    soundBtn.addEventListener('click', async () => {
      soundOn = !soundOn;
      video.muted = !soundOn;
      renderSound();
      // ★클릭은 사용자 제스처라 이 시점의 재생은 브라우저가 막지 않는다.
      //   인사 중에 켰다면 처음부터 다시 틀어 멘트를 놓치지 않게 한다.
      if (soundOn && root.dataset.state === 'greeting') video.currentTime = 0;
      try { await video.play(); } catch {}
    });
    renderSound();

    // 인사가 끝나면 스스로 대기로 돌아간다(다른 상태에서는 loop 라 ended 가 안 온다).
    video.addEventListener('ended', () => {
      if (root.dataset.state === 'greeting') setState('IDLE');
    });
    video.addEventListener('error', () => {
      if (root.dataset.state !== 'fallback') setState('FALLBACK');
    });
    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.origin !== location.origin) return;
      if (event.data?.type === 'SEOA_AVATAR_STATE') setState(event.data.state);
    });
    // ★부모가 먼저 보낸 상태가 있으면 덮어쓰지 않는다. 여기서 무조건 IDLE 을 걸면
    //   먼저 도착한 GREETING 이 지워진다(초기값은 이미 data-state="idle" 이다).
    if (root.dataset.state === 'idle') setState('IDLE');
    window.parent.postMessage({type:'SEOA_AVATAR_READY'}, location.origin);
  </script>
</body>
</html>
