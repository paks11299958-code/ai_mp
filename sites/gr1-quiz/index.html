<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GR1 촬영법 OX 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<main class="app">
  <!-- 로그인 -->
  <section id="login" class="card center" hidden>
    <p class="eyebrow">방사선일반촬영학 1</p>
    <h1>촬영법 OX 퀴즈</h1>
    <form id="loginForm" autocomplete="off">
      <label for="userId">아이디</label>
      <input id="userId" name="id" inputmode="latin" autocapitalize="none" spellcheck="false" required>
      <p class="error" id="loginError" role="alert"></p>
      <button class="primary" type="submit">들어가기</button>
    </form>
  </section>

  <!-- 시작 -->
  <section id="start" class="card center" hidden>
    <p class="eyebrow">방사선일반촬영학 1 · 강의 사진</p>
    <h1>사진을 보고 촬영법을 쓰세요</h1>
    <p class="hint">한글(예: 손 후전방향 촬영)이나 영어(예: Hand PA) 모두 정답입니다.<br>띄어쓰기·대소문자는 상관없어요.</p>
    <p class="total" id="totalInfo"></p>
    <button class="primary" id="startBtn" type="button">시작</button>
    <button class="ghost" id="logoutBtn" type="button">로그아웃</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" hidden>
    <header class="bar">
      <span id="progress">1 / 1</span>
      <div class="track"><div id="progressBar"></div></div>
      <span id="score" class="score">O 0 · X 0</span>
    </header>
    <figure class="photo"><img id="photo" alt="문제 사진"><figcaption class="loading" id="photoLoading">사진 불러오는 중…</figcaption></figure>
    <form id="answerForm" class="answer" autocomplete="off">
      <input id="answer" placeholder="촬영법 이름을 쓰세요" spellcheck="false" autocapitalize="none" required>
      <button class="primary" type="submit" id="submitBtn">제출</button>
    </form>
  </section>

  <!-- 결과 -->
  <section id="result" hidden>
    <div class="card center">
      <p class="eyebrow" id="resultMode">결과</p>
      <h1 id="resultScore"></h1>
      <p class="hint" id="resultRate"></p>
    </div>
    <div class="actions">
      <button class="primary" id="retryWrongBtn" type="button">오답 다시 풀기</button>
      <button class="secondary" id="restartBtn" type="button">다시 시작</button>
      <button class="ghost" id="exitBtn" type="button">종료</button>
    </div>
    <h2 id="wrongTitle">문제 다시 보기</h2>
    <ul class="wrong-list" id="wrongList"></ul>
  </section>

  <!-- 종료 안내(창이 안 닫힐 때) -->
  <section id="bye" class="card center" hidden>
    <h1>수고하셨어요</h1>
    <p class="hint">이 창을 닫아 주세요.</p>
  </section>
</main>

<!-- O / X 모달 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalMark">
    <p class="count" id="modalCount"></p>
    <div class="mark" id="modalMark">O</div>
    <p class="verdict" id="modalVerdict">정답!</p>
    <p class="right" id="modalAnswer"></p>
    <p class="given" id="modalGiven"></p>
    <button class="primary" id="nextBtn" type="button">다음</button>
  </div>
</div>
<!-- 사진 원본 크기로 크게 보기 -->
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt="원본 크기 사진"><button class="zoom-close" id="zoomClose" type="button" aria-label="닫기">✕</button><p class="zoom-hint">원본 크기 · 밀어서 보기 · 두 손가락으로 확대</p></div>
<script src="quiz.js"></script>
</body>
</html>
