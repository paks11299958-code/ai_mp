<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서아 AI 상담 아바타</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;overflow:hidden;background:#dce9f6}
    .avatar{position:relative;width:100vw;height:100dvh;display:grid;place-items:end center;background:radial-gradient(circle at 50% 22%,#fff 0,#edf5fc 48%,#c8daec 100%)}
    .avatar::after{content:"";position:absolute;inset:auto 8% 2.5% 8%;height:14%;border-radius:50%;background:rgba(49,83,119,.16);filter:blur(24px)}
    video{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center 34%;transform:translateZ(0);transition:filter .25s ease,transform .25s ease}
    [data-state="thinking"] video{filter:saturate(.92) brightness(.98);animation:thinking 1.9s ease-in-out infinite}
    [data-state="fallback"] video{filter:saturate(.82)}
    .state{position:absolute;z-index:2;left:50%;bottom:max(16px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:8px 12px;border:1px solid rgba(75,106,141,.2);border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 8px 28px rgba(33,63,99,.14);color:#31465e;font-size:12px;font-weight:700;white-space:nowrap;backdrop-filter:blur(10px)}
    .dot{width:7px;height:7px;border-radius:50%;background:#5f8fc6;box-shadow:0 0 0 4px rgba(95,143,198,.13)}
    [data-state="thinking"] .dot{animation:pulse 1s ease-in-out infinite}
    [data-state="speaking"] .dot{background:#28a170;box-shadow:0 0 0 4px rgba(40,161,112,.14)}
    [data-state="fallback"] .dot{background:#b98432;box-shadow:0 0 0 4px rgba(185,132,50,.14)}
    @keyframes thinking{50%{transform:translateY(-3px)}}
    @keyframes pulse{50%{opacity:.4;transform:scale(.72)}}
    @media(prefers-reduced-motion:reduce){video,.dot{animation:none!important;transition:none}}
  </style>
</head>
<body>
  <main class="avatar" id="avatar" data-state="idle">
    <video id="avatar-video" src="/seoa/avatar/idle.mp4" autoplay muted loop playsinline preload="auto" poster="/seoa/seoa_stand_check_20260827.png" aria-label="서아 AI 상담 아바타"></video>
    <div class="state" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="state-text">상담 준비가 되었어요</span></div>
  </main>
  <script type="module">
    import { AVATAR_STATES, createAvatarStateMachine, normalizeAvatarState } from '/avatar-state-machine.js';

    const root = document.querySelector('#avatar');
    const video = document.querySelector('#avatar-video');
    const status = document.querySelector('#state-text');
    const machine = createAvatarStateMachine({
      video,
      root,
      status,
      onStateChange: detail => window.parent.postMessage({ type: 'SEOA_AVATAR_STATE_CHANGED', ...detail }, location.origin),
    });

    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.origin !== location.origin) return;
      if (event.data?.type !== 'SEOA_AVATAR_STATE') return;
      const state = normalizeAvatarState(event.data.state);
      if (state) machine.setState(state, 'parent-command');
    });

    machine.setState(AVATAR_STATES.IDLE, 'initial');
    window.parent.postMessage({ type: 'SEOA_AVATAR_READY' }, location.origin);
  </script>
</body>
</html>
